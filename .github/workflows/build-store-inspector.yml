name: Build read-only Store inspector
on:
  push:
    branches: [main]
    paths: ['native/shortcut/**', 'native/src/**', 'native/tests/test_posix.c', 'tools/build-shortcut-icon.py', 'tools/build-shortcut-background.py', 'Manager/assets/jailbreak-background.png', 'tools/prepare-store-plan.py', '.github/workflows/build-store-inspector.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspector:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Test read-only inspector with sanitizers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libsqlite3-dev clang-18 lld-18
          mkdir -p native/build
          python -m pip install Pillow==13.0.0
          python tools/build-shortcut-icon.py
          python tools/build-shortcut-background.py
          gcc -std=c11 -Wall -Wextra -Werror -DHUB_HOST_TEST -Inative/src native/tests/test_posix.c native/src/posix.c -o native/build/posix-test
          native/build/posix-test
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -Wno-misleading-indentation -fsanitize=address,undefined -fno-pie -no-pie -DHUB_HOST_TEST -Inative/src native/shortcut/inspect.c native/src/storage.c native/src/sha256.c native/src/posix.c -lsqlite3 -o native/build/store-inspector-host
          ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 python native/shortcut/test_inspector.py native/build/store-inspector-host
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -Wno-misleading-indentation -fsanitize=address,undefined -fno-pie -no-pie -DHUB_HOST_TEST -Inative/src -Inative/build native/shortcut/patch.c native/shortcut/media.c native/src/storage.c native/src/sha256.c native/src/posix.c -lsqlite3 -o native/build/store-patch-host
          ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 python native/shortcut/test_patch.py native/build/store-patch-host
          gcc -std=c11 -O1 -g -Wall -Wextra -Werror -Wno-misleading-indentation -fsanitize=address,undefined -fno-pie -no-pie -DHUB_HOST_TEST -Inative/src -Inative/build native/shortcut/background.c native/src/storage.c native/src/sha256.c native/src/posix.c -lsqlite3 -o native/build/store-background-host
          ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 python native/shortcut/test_background.py native/build/store-background-host
      - name: Fetch pinned SDK and SQLite source
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/sdk.zip" https://github.com/ps5-payload-dev/sdk/releases/download/v0.45/ps5-payload-sdk.zip
          echo "5fac64093d0e3e69f2584ce7935f24f703f622d9681f1495c85b9f00d1291a2c  $RUNNER_TEMP/sdk.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/sdk"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/sqlite.zip" https://www.sqlite.org/2024/sqlite-amalgamation-3460100.zip
          sha256sum "$RUNNER_TEMP/sqlite.zip"
          unzip -q -j "$RUNNER_TEMP/sqlite.zip" '*/sqlite3.c' '*/sqlite3.h' -d native/build/sqlite
      - name: Compile PS5 read-only inspector
        env:
          PS5_PAYLOAD_SDK: ${{ runner.temp }}/sdk/ps5-payload-sdk
        run: |
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" -O2 -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION=1 -DSQLITE_MAX_MMAP_SIZE=0 -Inative/build/sqlite -c native/build/sqlite/sqlite3.c -o native/build/sqlite3.o
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation -Inative/src -Inative/build/sqlite native/shortcut/inspect.c native/src/storage.c native/src/sha256.c native/src/posix.c native/build/sqlite3.o -lkernel_sys -o native/build/PSN-HUB-Store-Inspector.elf
          sha256sum native/build/PSN-HUB-Store-Inspector.elf > native/build/PSN-HUB-Store-Inspector.elf.sha256
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation -Inative/src -Inative/build -Inative/build/sqlite native/shortcut/patch.c native/shortcut/media.c native/src/storage.c native/src/sha256.c native/src/posix.c native/build/sqlite3.o -lkernel_sys -o native/build/PSN-HUB-Store-Apply.elf
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation -DHUB_SHORTCUT_RESTORE -Inative/src -Inative/build -Inative/build/sqlite native/shortcut/patch.c native/shortcut/media.c native/src/storage.c native/src/sha256.c native/src/posix.c native/build/sqlite3.o -lkernel_sys -o native/build/PSN-HUB-Store-Restore.elf
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation -DHUB_SHORTCUT_RENAME -Inative/src -Inative/build -Inative/build/sqlite native/shortcut/patch.c native/shortcut/media.c native/src/storage.c native/src/sha256.c native/src/posix.c native/build/sqlite3.o -lkernel_sys -o native/build/PSN-HUB-Store-Rename.elf
          sha256sum native/build/PSN-HUB-Store-Rename.elf > native/build/PSN-HUB-Store-Rename.elf.sha256
          sha256sum native/build/PSN-HUB-Store-Apply.elf > native/build/PSN-HUB-Store-Apply.elf.sha256
          sha256sum native/build/PSN-HUB-Store-Restore.elf > native/build/PSN-HUB-Store-Restore.elf.sha256
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation -Inative/src -Inative/build -Inative/build/sqlite native/shortcut/background.c native/src/storage.c native/src/sha256.c native/src/posix.c native/build/sqlite3.o -lkernel_sys -o native/build/PSN-HUB-Store-Background.elf
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation -DHUB_BACKGROUND_RESTORE -Inative/src -Inative/build -Inative/build/sqlite native/shortcut/background.c native/src/storage.c native/src/sha256.c native/src/posix.c native/build/sqlite3.o -lkernel_sys -o native/build/PSN-HUB-Store-Background-Restore.elf
          sha256sum native/build/PSN-HUB-Store-Background.elf > native/build/PSN-HUB-Store-Background.elf.sha256
          sha256sum native/build/PSN-HUB-Store-Background-Restore.elf > native/build/PSN-HUB-Store-Background-Restore.elf.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: read-only-store-inspector
          path: |
            native/build/PSN-HUB-Store-Inspector.elf
            native/build/PSN-HUB-Store-Inspector.elf.sha256
            native/shortcut/README.md
          retention-days: 30

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: store-shortcut-test
          path: |
            native/build/PSN-HUB-Store-Rename.elf
            native/build/PSN-HUB-Store-Rename.elf.sha256
            native/build/PSN-HUB-Store-Apply.elf
            native/build/PSN-HUB-Store-Apply.elf.sha256
            native/build/PSN-HUB-Store-Restore.elf
            native/build/PSN-HUB-Store-Restore.elf.sha256
            native/build/psn-hub-icon.png
            native/shortcut/TESTING.md
            native/COPYING
          retention-days: 30

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: store-background
          path: |
            native/build/PSN-HUB-Store-Background.elf
            native/build/PSN-HUB-Store-Background.elf.sha256
            native/build/PSN-HUB-Store-Background-Restore.elf
            native/build/PSN-HUB-Store-Background-Restore.elf.sha256
            Manager/assets/jailbreak-background.png
            native/COPYING
          retention-days: 30
