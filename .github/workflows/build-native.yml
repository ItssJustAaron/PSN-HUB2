name: Build unified PSN-HUB Manager
on:
  push:
    branches: [main]
    paths: ['native/**', 'tools/build-native.py', 'tools/build-unified-assets.py', 'tools/build-icon-header.py', 'tools/build-shortcut-background.py', 'Manager/assets/**', 'Manager/dashboard.html', 'Manager/build.json', 'payloads/PSN-HUB-Manager.elf', '.github/workflows/build-native.yml']
  pull_request:
    paths: ['native/**', 'tools/build-native.py', 'Manager/dashboard.html', 'Manager/build.json', 'payloads/PSN-HUB-Manager.elf', '.github/workflows/build-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Generate embedded dashboard
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libsqlite3-dev clang-18 lld-18
          python tools/build-manager.py
          python tools/build-native.py
          python tools/build-shortcut-icon.py
          python tools/build-shortcut-background.py
          python tools/build-icon-header.py
          curl --fail --location --retry 3 -o native/build/blaze414-ps5-theme-v1.80.elf https://github.com/Blaze414/ps5-theme/releases/download/v1.80/ps5-theme.elf
          python tools/build-unified-assets.py
      - name: Compile portable server with sanitizers
        run: gcc -std=c11 -O1 -g -Wall -Wextra -Werror -Wno-misleading-indentation -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie -DHUB_HOST_TEST -DHUB_EMBEDDED -Inative/src -Inative/build native/src/*.c native/shortcut/background.c native/shortcut/icons.c native/shortcut/patch.c native/shortcut/media.c -lsqlite3 -o native/build/manager-host
      - name: Test raw syscall error translation
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -DHUB_HOST_TEST -Inative/src native/tests/test_posix.c native/src/posix.c -o native/build/posix-test
          native/build/posix-test
      - name: Test real HTTP and storage operations
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
        run: python native/tests/test_server.py native/build/manager-host
      - name: Install cross compiler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-18 lld-18
      - name: Fetch pinned official SDK
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/sdk.zip" https://github.com/ps5-payload-dev/sdk/releases/download/v0.45/ps5-payload-sdk.zip
          echo "5fac64093d0e3e69f2584ce7935f24f703f622d9681f1495c85b9f00d1291a2c  $RUNNER_TEMP/sdk.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/sdk.zip" -d "$RUNNER_TEMP/sdk"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/sqlite.zip" https://www.sqlite.org/2024/sqlite-amalgamation-3460100.zip
          echo "77823cb110929c2bcb0f5d48e4833b5c59a8a6e40cdea3936b99e199dbbe5784  $RUNNER_TEMP/sqlite.zip" | sha256sum --check
          unzip -q -j "$RUNNER_TEMP/sqlite.zip" '*/sqlite3.c' '*/sqlite3.h' -d native/build/sqlite
      - name: Build PS5 ELF
        env:
          PS5_PAYLOAD_SDK: ${{ runner.temp }}/sdk/ps5-payload-sdk
        run: |
          "$PS5_PAYLOAD_SDK/bin/prospero-clang" -O2 -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION=1 -DSQLITE_MAX_MMAP_SIZE=0 -Inative/build/sqlite -c native/build/sqlite/sqlite3.c -o native/build/sqlite3.o
          make -C native
          file native/build/PSN-HUB-Manager.elf
          sha256sum native/build/PSN-HUB-Manager.elf > native/build/PSN-HUB-Manager.elf.sha256
          sha256sum native/build/PSN-HUB-Manager-preflight.elf > native/build/PSN-HUB-Manager-preflight.elf.sha256
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: unified-manager
          path: |
            native/build/PSN-HUB-Manager.elf
            native/build/PSN-HUB-Manager.elf.sha256
            native/README.md
            native/SAVES.md
            native/COPYING
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: development-preflight
          path: |
            native/build/PSN-HUB-Manager-preflight.elf
            native/build/PSN-HUB-Manager-preflight.elf.sha256
          retention-days: 7
