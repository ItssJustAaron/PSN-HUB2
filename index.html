<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>PSNHUB-2 // PS5-Relapse</title>
  <style>
    :root {
      --bg-dark: #0a0d0a;
      --card-bg: #141c14;
      --card-border: #1e381e;
      --accent-green: #39ff14;
      --accent-purple: #9d4edd;
      --text-main: #f0fdf4;
      --text-muted: #86efac;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--accent-green);
      text-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border: 1px solid var(--accent-purple);
      border-radius: 999px;
      font-size: 0.85rem;
      color: #e9d5ff;
      background: rgba(157, 78, 221, 0.15);
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .payload-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }

    .payload-btn {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .payload-btn:hover {
      border-color: var(--accent-green);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(57, 255, 20, 0.15);
    }

    .payload-btn:active {
      transform: translateY(0);
    }

    .btn-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      font-size: 1.4rem;
    }

    .btn-title {
      font-weight: bold;
      font-size: 1.05rem;
      color: var(--accent-green);
    }

    .btn-desc {
      font-size: 0.8rem;
      color: #9ca3af;
      line-height: 1.3;
    }

    #console {
      background: #000;
      border: 2px solid var(--card-border);
      border-radius: 8px;
      padding: 14px;
      height: 220px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.4;
      color: var(--text-muted);
    }

    #console div {
      white-space: pre-wrap;
      word-break: break-all;
    }

    .footer {
      text-align: center;
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: auto;
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PSNHUB-2</h1>
      <span class="badge" id="fw-badge">Initializing...</span>
    </header>

    <div class="payload-grid">
      <!-- ShadowMount+ Payload -->
      <button class="payload-btn" onclick="loadElfPayload('shadowmount+.elf')">
        <div class="btn-header">
          <span class="btn-icon">📁</span>
          <span class="btn-title">ShadowMount+</span>
        </div>
        <span class="btn-desc">Mount & manage virtual optical drives / raw images</span>
      </button>

      <!-- ELF 2 -->
      <button class="payload-btn" onclick="loadElfPayload('elfldr-ps5-1.0.0.elf')">
        <div class="btn-header">
          <span class="btn-icon">⚡</span>
          <span class="btn-title">ELF Loader</span>
        </div>
        <span class="btn-desc">Standard ELF loader daemon for inbound sockets</span>
      </button>

      <!-- BIN / Other Payloads -->
      <button class="payload-btn" onclick="loadElfPayload('kstuff.elf')">
        <div class="btn-header">
          <span class="btn-icon">🛠️</span>
          <span class="btn-title">kstuff</span>
        </div>
        <span class="btn-desc">Kernel patches & homebrew execution support</span>
      </button>
    </div>

    <!-- Output Terminal -->
    <div id="console"></div>

    <div class="footer">PSNHUB-2 Host / Relapse Engine</div>
  </div>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
