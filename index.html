<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>PSN-HUB</title>
<style>
:root {
  --green-main: #39ff14;
  --purple-bg: #0d0216;
  --purple-card: #1f0733;
  --purple-border: #4a127a;
  --yellow-accent: #ffe600;
  --pink-accent: #ff007f;
  --border-thick: 3px solid #000;
  --box-shadow: 4px 4px 0px #000;
  --font-comic: 'Impact', 'Arial Black', sans-serif;
  --font-body: 'Arial', sans-serif;
}

* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

body {
  margin: 0; padding: 0;
  min-height: 100vh; width: 100%;
  overflow-x: hidden;
  background: radial-gradient(circle at center, #23063b 0%, var(--purple-bg) 100%);
  color: #fff;
  font-family: var(--font-body);
  display: flex; flex-direction: column;
  justify-content: space-between; align-items: center;
  position: relative;
}

#bg-canvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1; pointer-events: none;
}

/* Made By AKAY Blunt */
.blunt-badge {
  position: absolute; top: 14px; right: 18px;
  z-index: 10; display: flex; align-items: center;
  transform: rotate(-8deg);
  animation: bluntBob 3s ease-in-out infinite alternate;
  filter: drop-shadow(4px 4px 0px #000);
}
@keyframes bluntBob {
  0% { transform: rotate(-8deg) translateY(0px); }
  100% { transform: rotate(-4deg) translateY(-4px); }
}
.blunt-smoke {
  position: absolute; left: -22px; top: -12px;
  width: 22px; height: 22px;
  background: radial-gradient(circle, rgba(220, 220, 220, 0.75) 0%, rgba(255, 255, 255, 0) 70%);
  border-radius: 50%;
  animation: smokePuff 2.2s infinite ease-out;
  pointer-events: none;
}
@keyframes smokePuff {
  0% { transform: scale(0.6) translate(0, 0); opacity: 0.8; }
  50% { opacity: 0.5; }
  100% { transform: scale(2.2) translate(-14px, -24px); opacity: 0; }
}
.blunt-body {
  position: relative; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #6b3512 0%, #441d08 100%);
  border: 3.5px solid #000; border-radius: 6px 20px 20px 6px;
  padding: 6px 18px 6px 24px; box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.2);
}
.blunt-tip {
  position: absolute; left: -10px; width: 10px; height: calc(100% + 7px);
  background: radial-gradient(circle at center, #ff8400 0%, #ff2a00 65%, #3d1c10 100%);
  border: 3.5px solid #000; border-right: none; border-radius: 12px 0 0 12px;
  box-shadow: -2px 0px 8px rgba(255, 77, 0, 0.8);
}
.blunt-ash {
  position: absolute; left: -15px; width: 7px; height: 55%;
  background: #737373; border-radius: 4px 0 0 4px;
  border: 2px solid #000; border-right: none;
}
.blunt-text {
  font-family: var(--font-comic);
  color: var(--yellow-accent);
  font-size: 0.95rem; letter-spacing: 1.5px;
  white-space: nowrap; text-shadow: 2px 2px 0px #000;
}

.content-wrapper {
  position: relative; z-index: 2;
  width: 100%; max-width: 850px; min-height: 100vh;
  display: flex; flex-direction: column;
  justify-content: space-between; align-items: center;
  padding: 16px 14px;
}

header { text-align: center; margin-top: 6px; }
h1 {
  font-family: var(--font-comic);
  font-size: clamp(2.8rem, 7vw, 4.2rem);
  margin: 0; color: var(--green-main);
  text-shadow: 4px 4px 0px #000, -2px -2px 0px var(--pink-accent);
  letter-spacing: 2px;
}
.subtitle {
  color: var(--yellow-accent);
  font-family: monospace; font-size: 0.95rem; margin-top: 4px; letter-spacing: 1px;
}

/* Nav Tabs */
.nav-tabs {
  display: flex; gap: 14px; justify-content: center; margin-top: 10px;
}
.tab-link {
  font-family: var(--font-comic);
  text-decoration: none;
  background: var(--purple-card);
  color: #fff;
  border: var(--border-thick);
  border-radius: 12px;
  padding: 6px 18px;
  cursor: pointer;
  font-size: 0.95rem;
  box-shadow: 3px 3px 0px #000;
  transition: transform 0.15s ease;
}
.tab-link.active {
  background: var(--green-main);
  color: #000;
  box-shadow: 3px 3px 0px var(--pink-accent);
}
.tab-link:hover { transform: translateY(-2px); }

/* Mascot Area */
.mascot-area {
  position: relative; display: flex; justify-content: center;
  align-items: center; width: 100%; flex: 1; min-height: 180px; padding: 20px 0;
}
.character-card {
  position: relative; height: 100%; max-height: 380px;
  display: flex; justify-content: center; align-items: center;
  animation: mascotBob 3.2s ease-in-out infinite;
}
@keyframes mascotBob {
  0%, 100% { transform: translateY(0px) rotate(-1deg); }
  50% { transform: translateY(-8px) rotate(1deg); }
}
#mascot-canvas {
  max-height: 340px; width: auto; object-fit: contain;
  filter: drop-shadow(0px 10px 0px #000) drop-shadow(0px 0px 24px rgba(57, 255, 20, 0.5));
}

.btn-group {
  width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 12px 0 20px; flex-shrink: 0;
}
.btn {
  font-family: var(--font-comic);
  text-decoration: none;
  display: flex; justify-content: center; align-items: center;
  width: 100%; max-width: 420px; min-height: 64px; padding: 14px 20px;
  font-size: clamp(1.2rem, 3.5vw, 1.6rem);
  color: #000; background: var(--green-main);
  border: var(--border-thick); border-radius: 18px;
  box-shadow: var(--box-shadow); cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}
.btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0px #000;
  background: #5aff36;
}

#update-site {
  width: auto; max-width: 100%; min-height: 44px; padding: 10px 22px;
  font: 700 .85rem var(--font-body); letter-spacing: .06em;
  background: var(--purple-card); color: #c8e8c2;
  border: 1px solid #58764b; border-radius: 10px; box-shadow: none;
}
#update-site:hover { background: #2d1242; transform: translateY(-1px); }
#update-site:disabled { opacity: .6; cursor: wait; }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
#site-cache-status {
  width: 100%; max-width: 440px; margin: 0; padding: 0 12px;
  text-align: center; font-size: .8rem; line-height: 1.5; color: #b8a8c8;
  overflow-wrap: break-word;
}
@media (max-width: 480px) {
  .blunt-badge { position: relative; top: auto; right: auto; margin: 18px 0 8px; }
  .content-wrapper { min-height: calc(100vh - 64px); }
  #mascot-canvas { max-width: 80vw; max-height: 260px; }
}
@media (prefers-reduced-motion: reduce) {
  .character-card, .blunt-badge, .blunt-smoke { animation: none; }
}
footer {
  width: 100%; text-align: center; background: #000;
  border: var(--border-thick); border-radius: 10px;
  padding: 8px 10px; margin-bottom: 4px;
  box-shadow: 3px 3px 0px var(--pink-accent);
  font-size: 0.75rem; color: #ddd;
}

/* Modal Popup when trying to open payloads before running jailbreak */
#warning-modal {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0, 0, 0, 0.8);
  z-index: 100;
  justify-content: center;
  align-items: center;
}
.modal-box {
  background: var(--purple-card);
  border: 4px solid #000;
  border-radius: 20px;
  box-shadow: 6px 6px 0px #000, 0px 0px 24px var(--pink-accent);
  max-width: 420px;
  width: 90%;
  padding: 24px 20px;
  text-align: center;
}
.modal-box h3 {
  font-family: var(--font-comic);
  color: var(--pink-accent);
  font-size: 1.8rem;
  margin: 0 0 10px;
  letter-spacing: 1px;
}
.modal-box p {
  color: #eee;
  font-size: 0.95rem;
  line-height: 1.4;
  margin: 0 0 20px;
}
.modal-close-btn {
  font-family: var(--font-comic);
  background: var(--yellow-accent);
  color: #000;
  border: var(--border-thick);
  border-radius: 12px;
  padding: 10px 24px;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: var(--box-shadow);
}
.modal-close-btn:hover {
  background: #fff;
}
</style>
</head>

<script>
// Route directly if already executed, or prompt with modal if not executed yet
function handlePayloadsNav(e) {
  e.preventDefault();
  let jbDone = false;
  try { jbDone = sessionStorage.getItem("psn_jb_done") === "true"; } catch (e) {}
  if (jbDone) {
    window.location.href = "relapse.html?menu=1";
  } else {
    document.getElementById("warning-modal").style.display = "flex";
  }
}

function closeModal() {
  document.getElementById("warning-modal").style.display = "none";
}

// Edge flood-fill transparent background cleaner
function renderTransparentMascot(imgSrc) {
  var img = new Image();
  img.crossOrigin = "anonymous";
  img.src = imgSrc;
  img.onload = function() {
    var canvas = document.getElementById('mascot-canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var d = imgData.data;
    var w = canvas.width;
    var h = canvas.height;
    var visited = new Uint8Array(w * h);
    var queue = [];

    function isBgColor(idx) {
      return (d[idx] > 220 && d[idx + 1] > 220 && d[idx + 2] > 220);
    }

    for (var x = 0; x < w; x++) {
      queue.push(x, 0, x, h - 1);
      visited[x] = 1; visited[(h - 1) * w + x] = 1;
    }
    for (var y = 0; y < h; y++) {
      queue.push(0, y, w - 1, y);
      visited[y * w] = 1; visited[y * w + (w - 1)] = 1;
    }

    var qIdx = 0;
    while (qIdx < queue.length) {
      var cx = queue[qIdx++];
      var cy = queue[qIdx++];
      var pIdx = (cy * w + cx) * 4;

      if (isBgColor(pIdx)) {
        d[pIdx + 3] = 0;
        var neighbors = [cx + 1, cy, cx - 1, cy, cx, cy + 1, cx, cy - 1];
        for (var n = 0; n < neighbors.length; n += 2) {
          var nx = neighbors[n];
          var ny = neighbors[n + 1];
          if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
            var nPos = ny * w + nx;
            if (!visited[nPos]) {
              visited[nPos] = 1;
              if (isBgColor(nPos * 4)) queue.push(nx, ny);
            }
          }
        }
      }
    }
    ctx.putImageData(imgData, 0, 0);
  };
}

// Same lightweight leaf artwork and motion as Manager.
  function startLeafBackground() {
    // Canvas vectors keep the background lightweight and independent of artwork downloads.
    if (!document.body || !window.requestAnimationFrame) return;
    const canvas = document.getElementById('bg-canvas');
    canvas.setAttribute('aria-hidden', 'true');
    const ctx = canvas.getContext('2d'); if (!ctx) return;
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    let width = 0, height = 0, frame = 0, last = 0, leaves = [];
    const tips = [[-25,5],[-30,-14],[-18,-33],[0,-47],[18,-33],[30,-14],[25,5]];
    function leaf() {
      ctx.fillStyle = '#39ff14';
      for (const [tx,ty] of tips) {
        const dx = tx, dy = ty - 14, length = Math.hypot(dx,dy), nx = -dy/length, ny = dx/length;
        const breadth = Math.abs(tx) > 24 ? 5 : 6;
        ctx.beginPath(); ctx.moveTo(0,14);
        for (let side = 1; side >= -1; side -= 2) {
          for (let i = 1; i <= 12; i++) {
            const t = side === 1 ? i/12 : 1-i/12;
            const spread = Math.sin(Math.PI*t)*breadth*(i%2 ? 1 : .55)*side;
            ctx.lineTo(dx*t+nx*spread,14+dy*t+ny*spread);
          }
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.fillRect(-1,12,2,18);
    }
    function paint(time) {
      if (last && time-last < 1000/30) {
        frame = !reduced.matches && !document.hidden ? window.requestAnimationFrame(paint) : 0;
        return;
      }
      const dt = last ? Math.min((time-last)/1000,.05) : 0; last = time;
      ctx.clearRect(0,0,width,height);
      for (const item of leaves) {
        if (!reduced.matches) {
          item.y -= item.speed*dt; item.angle += item.spin*dt;
          if (item.y < -80) { item.y = height+80; item.x = Math.random()*width; }
        }
        ctx.save(); ctx.translate(item.x+Math.sin(item.y/140)*12,item.y); ctx.rotate(item.angle); ctx.scale(item.scale,item.scale);
        ctx.globalAlpha = item.alpha; leaf(); ctx.restore();
      }
      frame = !reduced.matches && !document.hidden ? window.requestAnimationFrame(paint) : 0;
    }
    function resume() {
      window.cancelAnimationFrame(frame); frame = 0; last = 0;
      if (!document.hidden) paint(0);
    }
    function resize() {
      width = window.innerWidth; height = window.innerHeight;
      const ratio = Math.min(window.devicePixelRatio || 1,1.5);
      canvas.width = Math.round(width*ratio); canvas.height = Math.round(height*ratio); ctx.setTransform(ratio,0,0,ratio,0,0);
      leaves = Array.from({length:width<700?10:20},()=>({x:Math.random()*width,y:Math.random()*height,scale:.25+Math.random()*.45,angle:Math.random()*Math.PI*2,speed:10+Math.random()*16,spin:(Math.random()-.5)*.18,alpha:.22+Math.random()*.35}));
      resume();
    }
    window.addEventListener('resize',resize); document.addEventListener('visibilitychange',resume);
    window.addEventListener('pagehide',()=>window.cancelAnimationFrame(frame));
    window.addEventListener('pageshow',resume);
    if (reduced.addEventListener) reduced.addEventListener('change',resume); else reduced.addListener(resume);
    resize();
  }

window.onload = function() {
  renderTransparentMascot("mascot.png");
  startLeafBackground();
};
</script>
