<style>
:root {
  --green-main: #39ff14;
  --purple-bg: #0d0216;
  --purple-card: #1f0733;
  --yellow-accent: #ffe600;
  --pink-accent: #ff007f;
  --border-thick: 3px solid #000;
  --box-shadow: 4px 4px 0px #000;
  --font-comic: 'Impact', 'Arial Black', sans-serif;
  --font-body: 'Arial', sans-serif;
}

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

body {
  margin: 0;
  padding: 0;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  background: radial-gradient(circle at center, #23063b 0%, var(--purple-bg) 100%);
  color: #fff;
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

#bg-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

.content-wrapper {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 850px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 14px 14px;
}

header {
  text-align: center;
  margin-top: 4px;
}

h1 {
  font-family: var(--font-comic);
  font-size: clamp(2.6rem, 6.5vw, 4rem);
  margin: 0;
  color: var(--green-main);
  text-shadow: 4px 4px 0px #000, -2px -2px 0px var(--pink-accent);
  letter-spacing: 2px;
}

.subtitle {
  color: var(--yellow-accent);
  font-family: monospace;
  font-size: 0.95rem;
  margin-top: 4px;
  letter-spacing: 1px;
}

/* Dynamic Mascot Container */
.mascot-area {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  flex: 1;
}

.mascot-svg {
  width: 100%;
  max-width: 440px;
  height: auto;
  max-height: 48vh;
  filter: drop-shadow(0px 10px 0px #000) drop-shadow(0px 0px 24px rgba(57, 255, 20, 0.45));
}

/* Mascot Keyframe Animations */
.anim-body {
  animation: leafFloat 3.2s ease-in-out infinite;
  transform-origin: 200px 330px;
}

.anim-hand-left {
  animation: handLeftSway 2.6s ease-in-out infinite alternate;
  transform-origin: 105px 170px;
}

.anim-hand-right {
  animation: handRightSway 2.8s ease-in-out infinite alternate;
  transform-origin: 295px 170px;
}

.anim-foot-left {
  animation: footTapLeft 1.6s ease-in-out infinite alternate;
  transform-origin: 165px 330px;
}

.anim-foot-right {
  animation: footTapRight 1.8s ease-in-out infinite alternate;
  transform-origin: 235px 330px;
}

@keyframes leafFloat {
  0%, 100% {
    transform: translateY(0px) rotate(-1deg) scaleY(1);
  }
  50% {
    transform: translateY(-9px) rotate(1.2deg) scaleY(1.02);
  }
}

@keyframes handLeftSway {
  0% { transform: translateY(0px) rotate(0deg); }
  100% { transform: translateY(-7px) rotate(-5deg); }
}

@keyframes handRightSway {
  0% { transform: translateY(0px) rotate(0deg); }
  100% { transform: translateY(-7px) rotate(5deg); }
}

@keyframes footTapLeft {
  0%, 80% { transform: translateY(0) rotate(0deg); }
  90% { transform: translateY(-3px) rotate(-4deg); }
  100% { transform: translateY(0) rotate(0deg); }
}

@keyframes footTapRight {
  0%, 80% { transform: translateY(0) rotate(0deg); }
  90% { transform: translateY(-3px) rotate(4deg); }
  100% { transform: translateY(0) rotate(0deg); }
}

.btn-group {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-bottom: 10px;
}

.btn {
  font-family: var(--font-comic);
  text-decoration: none;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 85%;
  max-width: 420px;
  padding: 14px 20px;
  font-size: clamp(1.2rem, 3.5vw, 1.6rem);
  color: #000;
  background: var(--green-main);
  border: var(--border-thick);
  border-radius: 18px;
  box-shadow: var(--box-shadow);
  cursor: pointer;
  outline: none;
  transition: transform 0.15s ease, background 0.15s ease;
}

.btn:hover, .btn:focus {
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0px #000;
  background: #5aff36;
}

footer {

  text-align: center;
  background: #000;
  border: var(--border-thick);
  border-radius: 10px;
  padding: 8px 10px;
  margin-bottom: 4px;
  box-shadow: 3px 3px 0px var(--pink-accent);
  font-size: 0.75rem;

<script>
// Floating Particle Canvas
var canvas = document.getElementById('bg-canvas');
var ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

var particles = [];
for (var i = 0; i < 22; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 5 + 3,
    speedY: Math.random() * -0.7 - 0.2
  });
}

function drawBackground() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#39ff14';
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.y += p.speedY;
    if (p.y < -10) {
      p.y = canvas.height + 10;
      p.x = Math.random() * canvas.width;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(drawBackground);
}
drawBackground();
</script>
