<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>PSN-HUB</title>
<style>
:root {
  --green-main: #39ff14;
  --purple-bg: #0d0216;
  --purple-card: #1f0733;
  --purple-border: #4a127a;
  --yellow-accent: #ffe600;
  --pink-accent: #ff007f;
  --border-thick: 3px solid #000;
  --box-shadow: 4px 4px 0px #000;
  --font-comic: 'Impact', 'Arial Black', sans-serif;
  --font-body: 'Arial', sans-serif;
}

* { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

body {
  margin: 0; padding: 0;
  height: 100vh; width: 100vw;
  overflow: hidden;
  background: radial-gradient(circle at center, #23063b 0%, var(--purple-bg) 100%);
  color: #fff;
  font-family: var(--font-body);
  display: flex; flex-direction: column;
  justify-content: space-between; align-items: center;
  position: relative;
}

#bg-canvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1; pointer-events: none;
}

.content-wrapper {
  position: relative; z-index: 2;
  width: 100%; max-width: 850px; height: 100vh;
  display: flex; flex-direction: column;
  justify-content: space-between; align-items: center;
  padding: 14px;
}

header { text-align: center; margin-top: 4px; }
h1 {
  font-family: var(--font-comic);
  font-size: clamp(2.6rem, 6.5vw, 4rem);
  margin: 0;
  color: var(--green-main);
  text-shadow: 4px 4px 0px #000, -2px -2px 0px var(--pink-accent);
  letter-spacing: 2px;
}
.subtitle {
  color: var(--yellow-accent);
  font-family: monospace;
  font-size: 0.95rem; margin-top: 4px; letter-spacing: 1px;
}

.mascot-area {
  position: relative; display: flex;
  justify-content: center; align-items: center;
  width: 100%; flex: 1;
}
.mascot-svg {
  width: 100%; max-width: 440px; height: auto; max-height: 48vh;
  filter: drop-shadow(0px 10px 0px #000) drop-shadow(0px 0px 24px rgba(57, 255, 20, 0.45));
}

.anim-body { animation: leafFloat 3.2s ease-in-out infinite; transform-origin: 200px 330px; }
.anim-hand-left { animation: handLeftSway 2.6s ease-in-out infinite alternate; transform-origin: 105px 170px; }
.anim-hand-right { animation: handRightSway 2.8s ease-in-out infinite alternate; transform-origin: 295px 170px; }
.anim-foot-left { animation: footTapLeft 1.6s ease-in-out infinite alternate; transform-origin: 165px 330px; }
.anim-foot-right { animation: footTapRight 1.8s ease-in-out infinite alternate; transform-origin: 235px 330px; }

@keyframes leafFloat {
  0%, 100% { transform: translateY(0px) rotate(-1deg); }
  50% { transform: translateY(-9px) rotate(1.2deg); }
}
@keyframes handLeftSway {
  0% { transform: translateY(0px) rotate(0deg); }
  100% { transform: translateY(-7px) rotate(-5deg); }
}
@keyframes handRightSway {
  0% { transform: translateY(0px) rotate(0deg); }
  100% { transform: translateY(-7px) rotate(5deg); }
}
@keyframes footTapLeft {
  0%, 80% { transform: translateY(0) rotate(0deg); }
  90% { transform: translateY(-3px) rotate(-4deg); }
  100% { transform: translateY(0) rotate(0deg); }
}
@keyframes footTapRight {
  0%, 80% { transform: translateY(0) rotate(0deg); }
  90% { transform: translateY(-3px) rotate(4deg); }
  100% { transform: translateY(0) rotate(0deg); }
}

.btn-group { width: 100%; display: flex; justify-content: center; margin-bottom: 10px; }
.btn {
  font-family: var(--font-comic);
  text-decoration: none;
  display: flex; justify-content: center; align-items: center;
  width: 85%; max-width: 420px;
  padding: 14px 20px;
  font-size: clamp(1.2rem, 3.5vw, 1.6rem);
  color: #000;
  background: var(--green-main);
  border: var(--border-thick);
  border-radius: 18px;
  box-shadow: var(--box-shadow);
  cursor: pointer; outline: none;
  transition: transform 0.15s ease, background 0.15s ease;
}
.btn:hover, .btn:focus {
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0px #000;
  background: #5aff36;
}

/* TERMINAL MODAL OVERLAY (Hidden until clicked) */
#terminal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(13, 2, 22, 0.88);
  backdrop-filter: blur(6px);
  z-index: 100;
  justify-content: center; align-items: center;
  animation: modalFadeIn 0.25s ease-out forwards;
}

@keyframes modalFadeIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

#term-wrapper {
  position: relative;
  width: 90%; max-width: 800px; height: 75vh;
  background: #08010d;
  border: 4px solid #000; border-radius: 20px;
  box-shadow: 8px 8px 0px #000, 0px 0px 24px rgba(57, 255, 20, 0.35);
  display: flex; flex-direction: column; overflow: hidden;
}

.term-header {
  background: var(--purple-card);
  border-bottom: 3px solid #000;
  padding: 10px 16px;
  display: flex; justify-content: space-between; align-items: center;
}
.term-dots { display: flex; gap: 8px; }
.term-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #000; }
.dot-red { background: var(--pink-accent); }
.dot-yellow { background: var(--yellow-accent); }
.dot-green { background: var(--green-main); }
.term-title {
  font-family: var(--font-comic);
  color: var(--green-main);
  letter-spacing: 1.5px; font-size: 1.15rem;
  text-shadow: 2px 2px 0px #000;
}
.term-badge {
  background: #000; color: var(--yellow-accent);
  font-family: monospace; font-size: 0.75rem;
  padding: 2px 8px; border-radius: 6px;
  border: 1.5px solid var(--purple-border);
}

.crt-screen {
  position: relative; flex: 1; padding: 16px 20px;
  background: #040106; overflow: hidden;
}
.crt-screen::before {
  content: " "; position: absolute;
  top: 0; left: 0; bottom: 0; right: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
  background-size: 100% 4px;
  z-index: 10; pointer-events: none;
}

#console-output {
  height: 100%; overflow-y: auto;
  font: 13px/1.55 'Courier New', Courier, monospace;
  white-space: pre-wrap; word-break: break-all;
  color: #a3ff8f;
  text-shadow: 0 0 5px rgba(57, 255, 20, 0.4);
  padding-bottom: 20px;
}
#console-output div { padding: 1px 0; }
.LOG-DEBUG { color: #6f548d; }
.LOG-INFO { color: var(--green-main); }
.LOG-LOG { color: #87f573; }
.LOG-WARN { color: var(--yellow-accent); }
.LOG-ERROR { color: var(--pink-accent); }
.LOG-SUCCESS { color: #fff; background: #133a08; font-weight: bold; }

.cursor {
  display: inline-block; width: 8px; height: 14px;
  background: var(--green-main); vertical-align: middle;
  animation: blink 0.8s infinite; margin-left: 4px;
}
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

footer {
  width: 100%; text-align: center;
  background: #000; border: var(--border-thick);
  border-radius: 10px; padding: 8px 10px; margin-bottom: 4px;
  box-shadow: 3px 3px 0px var(--pink-accent);
  font-size: 0.75rem; color: #ddd;
}
</style>
</head>

<!-- HIDDEN IFRAME FOR REAL EXPLOIT RUNNER -->
<iframe id="exploit-runner" style="display:none;"></iframe>

<script>
// Floating Particle Canvas
var canvas = document.getElementById('bg-canvas');
var ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

var particles = [];
for (var i = 0; i < 22; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 5 + 3,
    speedY: Math.random() * -0.7 - 0.2
  });
}
function drawBackground() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#39ff14';
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.y += p.speedY;
    if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(drawBackground);
}
drawBackground();

// LAUNCH EXPLOIT OVERLAY
function launchExploit() {
  var overlay = document.getElementById('terminal-overlay');
  overlay.style.display = 'flex';

  var consoleView = document.getElementById('console-output');
  consoleView.innerHTML = '<div>> [BOOT] Initializing WebKit engine...</div><div>> [BOOT] Preparing memory pipeline...</div>';

  var cursor = document.createElement('span');
  cursor.className = 'cursor';
  consoleView.appendChild(cursor);

  // Load relapse.html inside iframe to execute exploit without blanking screen
  var iframe = document.getElementById('exploit-runner');
  iframe.src = 'relapse.html';
}

// Receive live log lines and completion messages from relapse.html inside iframe
window.addEventListener('message', function(event) {
  var data = event.data;
  if (!data || typeof data !== 'object') return;

  var consoleView = document.getElementById('console-output');
  var badge = document.getElementById('term-status-badge');

  if (data.type === 'log') {
    var line = document.createElement('div');
    line.className = data.level || 'LOG-LOG';
    line.textContent = '> ' + data.message;
    var cursor = consoleView.querySelector('.cursor');
    if (cursor) cursor.remove();
    consoleView.appendChild(line);
    var newCursor = document.createElement('span');
    newCursor.className = 'cursor';
    consoleView.appendChild(newCursor);
    consoleView.scrollTop = consoleView.scrollHeight;
  }

  if (data.type === 'stage') {
    badge.textContent = data.stage;
  }

  if (data.type === 'done') {
    badge.textContent = 'ELF LOADER ACTIVE';
    // Navigate directly into relapse.html with full screen payloads
    setTimeout(function() {
      window.location.href = 'relapse.html?show_payloads=1';
    }, 1200);
  }
});
</script>
