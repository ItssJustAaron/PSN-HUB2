<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>PS5-Relapse // 420 Edition</title>
  
  <!-- Retro 90s Cartoon & Arcade Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=VT323&family=Fredoka+One&display=swap" rel="stylesheet">

  <style>
    :root {
      --weed-green: #39ff14;
      --deep-herb: #1b4d24;
      --bud-lime: #a6e22e;
      --purp-haze: #7b1fa2;
      --blaze-orange: #ff7700;
      --paper-cream: #f4eedb;
      --cartoon-stroke: #121212;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at center, #1e3822 0%, #0d1a0f 70%, #050a06 100%);
      color: #fff;
      font-family: 'Fredoka One', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      position: relative;
    }

    /* CRT Scanline & Grain Overlay */
    body::before {
      content: " ";
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 100;
      pointer-events: none;
    }

    /* Cartoon Smoke Particles in Background */
    .smoke-puff {
      position: absolute;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      filter: blur(20px);
      animation: drift 14s infinite linear;
      z-index: 0;
    }

    @keyframes drift {
      0% { transform: translateY(105vh) scale(0.8) rotate(0deg); opacity: 0; }
      20% { opacity: 0.6; }
      80% { opacity: 0.4; }
      100% { transform: translateY(-20vh) scale(1.6) rotate(360deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 820px;
      margin: 30px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Sticker Header */
    .header-box {
      background: var(--weed-green);
      border: 4px solid var(--cartoon-stroke);
      box-shadow: 8px 8px 0px var(--cartoon-stroke);
      padding: 18px 30px;
      border-radius: 24px;
      transform: rotate(-1.5deg);
      text-align: center;
      position: relative;
      width: 100%;
    }

    .header-box h1 {
      margin: 0;
      font-family: 'Bungee', cursive;
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: #fff;
      text-shadow: 
        4px 4px 0 var(--cartoon-stroke),
        -2px -2px 0 var(--cartoon-stroke),
        2px -2px 0 var(--cartoon-stroke),
        -2px 2px 0 var(--cartoon-stroke);
      letter-spacing: 2px;
    }

    .tagline {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      color: var(--purp-haze);
      background: var(--paper-cream);
      display: inline-block;
      padding: 4px 14px;
      border-radius: 12px;
      border: 3px solid var(--cartoon-stroke);
      box-shadow: 3px 3px 0 var(--cartoon-stroke);
      margin-top: 8px;
      transform: rotate(2deg);
    }

    /* Cartoony PS5 Leaf Mascot */
    .mascot {
      width: 70px;
      height: 70px;
      position: absolute;
      top: -30px;
      right: 15px;
      transform: rotate(15deg);
      filter: drop-shadow(4px 4px 0 var(--cartoon-stroke));
      animation: bobble 3s ease-in-out infinite alternate;
    }

    @keyframes bobble {
      0% { transform: translateY(0) rotate(12deg); }
      100% { transform: translateY(-8px) rotate(18deg); }
    }

    /* PS5 Controller Button Bar */
    .quick-status-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .badge {
      background: #111;
      border: 3px solid var(--cartoon-stroke);
      box-shadow: 4px 4px 0 var(--cartoon-stroke);
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-fw {
      background: var(--blaze-orange);
      color: #000;
      font-weight: bold;
    }

    .indicator-light {
      width: 12px;
      height: 12px;
      background: var(--weed-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--weed-green);
      border: 2px solid var(--cartoon-stroke);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* Console Container Styled as a Retro Joint/Arcade Monitor */
    .monitor-frame {
      width: 100%;
      background: #152217;
      border: 5px solid var(--cartoon-stroke);
      border-radius: 20px;
      box-shadow: 10px 10px 0 var(--cartoon-stroke);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .monitor-top {
      background: var(--purp-haze);
      border-bottom: 4px solid var(--cartoon-stroke);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .window-dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--cartoon-stroke);
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .window-title {
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      letter-spacing: 1px;
    }

    /* Native Exploit Output Target (#console) */
    #console {
      height: 280px;
      background-color: #050b07;
      padding: 16px;
      font-family: 'VT323', monospace;
      font-size: 1.35rem;
      line-height: 1.4;
      color: var(--weed-green);
      text-shadow: 0 0 4px rgba(57, 255, 20, 0.4);
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #console::-webkit-scrollbar {
      width: 10px;
    }
    #console::-webkit-scrollbar-track {
      background: #09130b;
    }
    #console::-webkit-scrollbar-thumb {
      background: var(--deep-herb);
      border: 2px solid var(--cartoon-stroke);
    }

    /* Footer Stickers / Action Elements */
    .stickers-footer {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 10px;
      font-family: 'VT323', monospace;
      font-size: 1.1rem;
      color: #7b9e82;
    }
  </style>
</head>
<body>

  <!-- Floating Weed Smoke Puffs -->
  <div class="smoke-puff" style="width: 140px; height: 140px; left: 15%; animation-delay: 0s;"></div>
  <div class="smoke-puff" style="width: 220px; height: 220px; left: 65%; animation-delay: 5s;"></div>
  <div class="smoke-puff" style="width: 180px; height: 180px; left: 35%; animation-delay: 9s;"></div>

  <div class="container">
    
    <!-- Cartoon Header -->
    <header class="header-box">
      <!-- 7-point Cartoon Weed Leaf SVG -->
      <svg class="mascot" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 82C50 82 46 68 35 70C24 72 20 62 20 62C20 62 30 55 35 48C40 41 30 35 30 35C30 35 42 38 47 30C50 22 50 10 50 10C50 10 50 22 53 30C58 38 70 35 70 35C70 35 60 41 65 48C70 55 80 62 80 62C80 62 76 72 65 70C54 68 50 82 50 82Z" 
              fill="#39ff14" stroke="#121212" stroke-width="4" stroke-linejoin="round"/>
        <path d="M50 82V94" stroke="#121212" stroke-width="5" stroke-linecap="round"/>
        <!-- Cartoon Baked Eyes -->
        <ellipse cx="44" cy="48" rx="4" ry="2" fill="#ff4d4d" stroke="#121212" stroke-width="1.5"/>
        <ellipse cx="56" cy="48" rx="4" ry="2" fill="#ff4d4d" stroke="#121212" stroke-width="1.5"/>
        <path d="M46 56Q50 60 54 56" stroke="#121212" stroke-width="2" stroke-linecap="round"/>
      </svg>
      
      <h1>PS5 - RELAPSE</h1>
      <div class="tagline">★ 420 HOST // ROLL IT & LOAD IT ★</div>
    </header>

    <!-- Host Status & Info Row -->
    <div class="quick-status-bar">
      <div class="badge">
        <span class="indicator-light"></span>
        <span>DAEMON: READY</span>
      </div>
      <div class="badge badge-fw">
        <span>FW: 3.xx - 4.xx</span>
      </div>
      <div class="badge">
        <span>STATUS: EXECUTING</span>
      </div>
    </div>

    <!-- Arcade Styled Exploit Console -->
    <div class="monitor-frame">
      <div class="monitor-top">
        <div class="window-dots">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
        <div class="window-title">[ TTY: /DEV/STASH - PAYLOAD ENGINE ]</div>
        <div style="width: 50px;"></div>
      </div>
      
      <!-- Primary Exploit DOM Mount -->
      <div id="console"></div>
    </div>

    <div class="stickers-footer">
      <span>[X] EXPLOIT ACTIVE</span>
      <span>KEEP BROWSER RUNNING • DO NOT REBOOT</span>
    </div>

  </div>

  <!-- Intact Native PS5 Exploit Scripts -->
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
