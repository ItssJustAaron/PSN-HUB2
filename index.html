<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>PSN-HUB</title>
<style>
:root {
  --green-main: #39ff14;
  --purple-bg: #0d0216;
  --purple-card: #1f0733;
  --yellow-accent: #ffe600;
  --pink-accent: #ff007f;
  --border-thick: 3px solid #000;
  --box-shadow: 4px 4px 0px #000;
  --font-comic: 'Impact', 'Arial Black', sans-serif;
  --font-body: 'Arial', sans-serif;
}

* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

body {
  margin: 0;
  padding: 0;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
  background: radial-gradient(circle at center, #23063b 0%, var(--purple-bg) 100%);
  color: #fff;
  font-family: var(--font-body);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  position: relative;
}

#bg-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

.content-wrapper {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 850px;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 16px 14px;
}

header {
  text-align: center;
  margin-top: 6px;
}

h1 {
  font-family: var(--font-comic);
  font-size: clamp(2.8rem, 7vw, 4.2rem);
  margin: 0;
  color: var(--green-main);
  text-shadow: 4px 4px 0px #000, -2px -2px 0px var(--pink-accent);
  letter-spacing: 2px;
}

.subtitle {
  color: var(--yellow-accent);
  font-family: monospace;
  font-size: 0.95rem;
  margin-top: 4px;
  letter-spacing: 1px;
}

/* Mascot Display Area */
.mascot-area {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  flex: 1;
}

.character-card {
  position: relative;
  height: 100%;
  max-height: 400px;
  display: flex;
  justify-content: center;
  align-items: center;
  animation: mascotBob 3.2s ease-in-out infinite;
}

@keyframes mascotBob {
  0%, 100% { transform: translateY(0px) rotate(-1deg); }
  50% { transform: translateY(-8px) rotate(1deg); }
}

#mascot-canvas {
  max-height: 360px;
  max-width: 90vw;
  width: auto;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0px 10px 0px #000) drop-shadow(0px 0px 24px rgba(57, 255, 20, 0.5));
}

.btn-group {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-bottom: 12px;
}

.btn {
  font-family: var(--font-comic);
  text-decoration: none;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 85%;
  max-width: 420px;
  padding: 14px 20px;
  font-size: clamp(1.2rem, 3.5vw, 1.6rem);
  color: #000;
  background: var(--green-main);
  border: var(--border-thick);
  border-radius: 18px;
  box-shadow: var(--box-shadow);
  cursor: pointer;
  outline: none;
  transition: transform 0.15s ease, background 0.15s ease;
}

.btn:hover, .btn:focus {
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0px #000;
  background: #5aff36;
}

footer {
  width: 100%;
  text-align: center;
  background: #000;
  border: var(--border-thick);
  border-radius: 10px;
  padding: 8px 10px;
  margin-bottom: 4px;
  box-shadow: 3px 3px 0px var(--pink-accent);
  font-size: 0.75rem;
  color: #ddd;
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="content-wrapper">
  <header>
    <h1>PSN-HUB</h1>
    <div class="subtitle">PS5 EXPLOIT HOST (7.00 - 13.60)</div>
  </header>

  <!-- Mascot container rendering directly with transparent canvas -->
  <div class="mascot-area">
    <div class="character-card">
      <canvas id="mascot-canvas"></canvas>
    </div>
  </div>

  <div class="btn-group">
    <a class="btn" id="run-jb" href="relapse.html">JAILBREAK NOW</a>
  </div>

  <footer>
    CREDS &amp; GREETZ: Karo, Zecoxao, ChendoChap, flat_z, TheFlow &amp; all relapsers!
  </footer>
</div>

<script>
// 1. Removes all white/off-white background pixels from the mascot image
function renderTransparentMascot(imgSrc) {
  var img = new Image();
  img.crossOrigin = "anonymous";
  img.src = imgSrc;
  img.onload = function() {
    var canvas = document.getElementById('mascot-canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    var ctx = canvas.getContext('2d');

    ctx.drawImage(img, 0, 0);
    var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    var d = imgData.data;

    // Iterate through every pixel; convert white background to transparent
    for (var i = 0; i < d.length; i += 4) {
      var r = d[i];
      var g = d[i+1];
      var b = d[i+2];

      // If pixel is white or near-white (background threshold)
      if (r > 235 && g > 235 && b > 235) {
        d[i+3] = 0; // Alpha channel -> fully transparent
      }
    }
    ctx.putImageData(imgData, 0, 0);
  };
}

// 2. Background floating particles
var bgCanvas = document.getElementById('bg-canvas');
var bgCtx = bgCanvas.getContext('2d');

function resizeBg() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
}
resizeBg();
window.addEventListener('resize', resizeBg);

var particles = [];
for (var i = 0; i < 22; i++) {
  particles.push({
    x: Math.random() * bgCanvas.width,
    y: Math.random() * bgCanvas.height,
    size: Math.random() * 5 + 3,
    speedY: Math.random() * -0.7 - 0.2
  });
}

function drawBackground() {
  bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
  bgCtx.fillStyle = '#39ff14';
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.y += p.speedY;
    if (p.y < -10) {
      p.y = bgCanvas.height + 10;
      p.x = Math.random() * bgCanvas.width;
    }
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    bgCtx.fill();
  }
  requestAnimationFrame(drawBackground);
}

window.onload = function() {
  // Pass the filename of the mascot image here:
  renderTransparentMascot("mascot.png");
  drawBackground();
};
</script>

</body>
</html>
