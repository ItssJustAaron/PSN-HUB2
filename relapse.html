<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSN-HUB - Exploit Terminal</title>
<style>
  :root {
    --green-main: #39ff14;
    --purple-bg: #0d0216;
    --purple-card: #1f0733;
    --purple-border: #4a127a;
    --yellow-accent: #ffe600;
    --pink-accent: #ff007f;
    --font-comic: 'Impact', 'Arial Black', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, #23063b 0%, var(--purple-bg) 100%);
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Retro Terminal Wrapper */
  #term-wrapper {
    position: relative;
    width: 92%;
    max-width: 860px;
    height: 82vh;
    background: #08010d;
    border: 4px solid #000;
    border-radius: 20px;
    box-shadow: 8px 8px 0px #000, 0px 0px 24px rgba(57, 255, 20, 0.35);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 5;
  }

  /* Cartoon Terminal Top Bar */
  .term-header {
    background: var(--purple-card);
    border-bottom: 3px solid #000;
    padding: 10px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    user-select: none;
  }

  .term-dots {
    display: flex;
    gap: 8px;
  }

  .term-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid #000;
  }
  .dot-red { background: var(--pink-accent); }
  .dot-yellow { background: var(--yellow-accent); }
  .dot-green { background: var(--green-main); }

  .term-title {
    font-family: var(--font-comic);
    color: var(--green-main);
    letter-spacing: 1.5px;
    font-size: 1.15rem;
    text-shadow: 2px 2px 0px #000;
  }

  .term-badge {
    background: #000;
    color: var(--yellow-accent);
    font-family: monospace;
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1.5px solid var(--purple-border);
  }

  /* CRT Screen Area */
  .crt-screen {
    position: relative;
    flex: 1;
    padding: 16px 20px;
    background: #040106;
    overflow: hidden;
  }

  /* Scanlines Overlay */
  .crt-screen::before {
    content: " ";
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
    background-size: 100% 4px;
    z-index: 10;
    pointer-events: none;
  }

  /* Console Output */
  #console {
    height: 100%;
    overflow-y: auto;
    font: 13.5px/1.55 'Courier New', Courier, monospace;
    white-space: pre-wrap;
    word-break: break-all;
    color: #a3ff8f;
    text-shadow: 0 0 5px rgba(57, 255, 20, 0.4);
    padding-bottom: 24px;
  }

  #console::-webkit-scrollbar {
    width: 8px;
  }
  #console::-webkit-scrollbar-track {
    background: #000;
  }
  #console::-webkit-scrollbar-thumb {
    background: var(--green-main);
    border-radius: 4px;
  }

  #console div { padding: 1.5px 0; }
  .LOG-DEBUG { color: #6f548d; text-shadow: none; }
  .LOG-INFO { color: var(--green-main); }
  .LOG-LOG { color: #87f573; }
  .LOG-WARN { color: var(--yellow-accent); text-shadow: 0 0 5px rgba(255, 230, 0, 0.5); }
  .LOG-ERROR { color: var(--pink-accent); text-shadow: 0 0 6px rgba(255, 0, 127, 0.6); }
  .LOG-SUCCESS { color: #fff; background: #133a08; font-weight: bold; padding: 2px 4px; }

  /* Blinking Retro Cursor */
  .cursor {
    display: inline-block;
    width: 9px;
    height: 15px;
    background: var(--green-main);
    vertical-align: middle;
    animation: blink 0.8s infinite;
    margin-left: 4px;
    box-shadow: 0 0 8px var(--green-main);
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
</style>
</head>
<body>

<div id="term-wrapper">
  <div class="term-header">
    <div class="term-dots">
      <div class="term-dot dot-red"></div>
      <div class="term-dot dot-yellow"></div>
      <div class="term-dot dot-green"></div>
    </div>
    <div class="term-title">PSN-HUB // KERNEL_INIT</div>
    <div class="term-badge">STAGE: RUNNING</div>
  </div>

  <div class="crt-screen">
    <div id="console"></div>
  </div>
</div>

<script src="rop.js"></script>
<script src="payloads.js?v=1"></script>
<script src="firmware.js?v=4"></script>
<script src="main.js?v=6"></script>

<script>
window.offsetsReady = new Promise(function (resolve, reject) {
    var script = document.querySelector('script[src^="offsets/"]');
    if (!script) return reject(new Error("main.js never injected an offsets script"));
    if (typeof OFFSET_wk_vtable_first_element !== "undefined") return resolve(script.src);
    script.addEventListener("load", function () { resolve(script.src); });
    script.addEventListener("error", function () {
        reject(new Error("offsets script failed to load: " + script.src));
    });
});
</script>

<script src="syscalls.js"></script>

<script>
(function () {
    var query = new URLSearchParams(location.search);
    window.AIO_CFG = {};
    if (query.get("kexp")) AIO_CFG.kexp = query.get("kexp");
    if (query.get("elfldr")) AIO_CFG.elfldr = query.get("elfldr");
})();
</script>

<script type="module">
import { establishPrimitive, fakeCellReleased, CORE_INSTANCE } from "./core.js?v=132";
import { installWindowP, pairStatus, memCoreInstance } from "./mem.js?v=131";

if (CORE_INSTANCE !== memCoreInstance)
    throw new Error("core.js module skew: index.html and mem.js imported different ?v= URLs");

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

var __bseq = 0;
function __bcn(m) {
    try {
        new Image().src = "log/LT-s" + (++__bseq) + "-" + encodeURIComponent(String(m)).slice(0, 400) + "?t=" + Date.now();
    } catch (e) {}
}

// Cursor management inside the terminal
let cursorEl = document.createElement("span");
cursorEl.className = "cursor";

function print(message, level) {
    __bcn(message);
    try {
        window.parent.postMessage({ type: 'log', message: String(message), level: level }, '*');
    } catch (e) {}
    const line = document.createElement("div");
    line.className = level || "LOG-LOG";
    line.textContent = "> " + String(message);
    const view = document.getElementById("console");
    if (view) {
        if (cursorEl.parentNode) cursorEl.remove();
        view.appendChild(line);
        view.appendChild(cursorEl);
        view.scrollTop = view.scrollHeight;
    }
}

function reportFailure(error) {
    const message = String((error && error.message) || error)
        + ((error && error.stack) ? " @" + error.stack : "");
    print("FAILED: " + message, "LOG-ERROR");
    try { window.__rep("PAGE-FAIL", message.slice(0, 400)); } catch (e) {}

    const transient = /ROP worker never answered|rop thread ran away|ROP-TIMEOUT|core: gave up after .*attempts|Reload\./i.test(message);
    if (!transient) return;

    let retries = 0;
    try { retries = parseInt(sessionStorage.getItem("relapse.auto-retry") || "0", 10) || 0; } catch (e) {}
    if (retries >= 1) {
        print("automatic retry already used; halt", "LOG-WARN");
        return;
    }

    retries++;
    try { sessionStorage.setItem("relapse.auto-retry", String(retries)); } catch (e) {}
    print("transient failure detected - recycling browser environment...", "LOG-WARN");
    setTimeout(() => {
        try { history.replaceState(null, ""); } catch (e) {}
        location.reload();
    }, 900);
}

window.jb = { mark: (tag, detail) => print(detail ? tag + " " + detail : tag, "LOG-INFO") };
window.addEventListener("error", (e) => print("error: " + (e && e.message), "LOG-ERROR"));
window.addEventListener("unhandledrejection", (e) =>
    print("rejected: " + String((e && e.reason && e.reason.message) || (e && e.reason)), "LOG-ERROR"));

async function establishUserlandPrimitive() {
    if (globalThis.p && typeof globalThis.p.read8 === "function") {
        print("reusing userland primitive", "LOG-INFO");
        return globalThis.p;
    }

    print("running WebKit memory placement...", "LOG-INFO");
    try { history.replaceState(null, ""); } catch (e) {}
    if (typeof globalThis.gc === "function") { try { globalThis.gc(); } catch (e) {} }
    await sleep(750);

    const carrier = await establishPrimitive({
        maxAttempts: 24,
        onEvent(tag, detail, attempt) {
            print((typeof attempt === "number" ? "[" + attempt + "] " : "") + tag
                + (detail ? " " + detail : ""), "LOG-DEBUG");
        },
        beforeCriticalLoad() {
            try { document.getElementById("console").offsetWidth; } catch (e) {}
        },
    });

    installWindowP(carrier, {
        onEvent(tag, detail) {
            print(tag + " " + detail, "LOG-DEBUG");
            try { window.__rep(tag, String(detail ?? "").slice(0, 400)); } catch (e) {}
        },
    });
    if (!pairStatus.promoted)
        throw new Error("primitive pair not promoted: " + pairStatus.error);

    if (typeof globalThis.gc === "function") { try { globalThis.gc(); } catch (e) {} }
    await sleep(1000);

    const p = globalThis.p;
    if (!p || typeof p.read8 !== "function") throw new Error("window.p not published");
    print("primitive ready (fakeCellReleased=" + fakeCellReleased() + ")", "LOG-SUCCESS");
    return p;
}

async function run() {
    print("system check initiated", "LOG-INFO");
    const rejection = window.firmware.rejection();
    if (rejection) throw new Error(rejection);

    await offsetsReady;
    print("firmware target detected: " + window.fw_str, "LOG-INFO");

    const p = await establishUserlandPrimitive();

    await import("./exploit.js");
    print("executing ROP kernel chain...", "LOG-WARN");
    await main(p);

    if (!window.__elfldrUp || typeof window.__sendPayload !== "function") return;
}

/** Injects the matching PSN-HUB Payload Screen when done */
function buildPayloadMenu() {
    const existing = document.getElementById("relapse-payload-menu");
    if (existing) return existing;
    const tiles = window.PAYLOAD_TILES || [];
    if (!tiles.length) return print("no payloads defined (payloads.js missing)", "LOG-ERROR");

    const style = document.createElement("style");
    style.textContent = `
      #relapse-payload-menu {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        box-sizing: border-box;
        padding: 24px 16px;
        background: radial-gradient(circle at center, #23063b 0%, var(--purple-bg) 100%) !important;
        color: #fff !important;
        font-family: Arial, sans-serif;
        overflow-y: auto;
        z-index: 100;
      }

      #relapse-payload-menu .payload-header {
        text-align: center;
        max-width: 900px;
        margin: 0 auto 20px;
      }

      #relapse-payload-menu h2 {
        font-family: var(--font-comic);
        font-size: clamp(2rem, 5vw, 3.2rem);
        margin: 0 0 6px;
        color: var(--green-main) !important;
        -webkit-text-fill-color: var(--green-main) !important;
        text-shadow: 4px 4px 0px #000, -2px -2px 0px var(--pink-accent);
        letter-spacing: 2px;
      }

      #relapse-payload-menu .payload-status {
        margin: 0;
        color: var(--yellow-accent) !important;
        -webkit-text-fill-color: var(--yellow-accent) !important;
        font-family: monospace;
        font-size: 0.95rem;
      }

      #relapse-payload-menu .payload-help {
        margin: 4px 0 0;
        color: #ddd !important;
        -webkit-text-fill-color: #ddd !important;
        font-size: 0.82rem;
      }

      #relapse-payload-menu .payload-grid {
        display: grid !important;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        width: 100%;
        max-width: 850px;
        margin: 0 auto 30px;
        box-sizing: border-box;
      }

      #relapse-payload-menu .payload-tile {
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
        box-sizing: border-box;
        width: 100%;
        min-height: 96px;
        padding: 10px 14px;
        background: var(--purple-card) !important;
        border: 2px solid var(--purple-border) !important;
        border-radius: 14px;
        text-decoration: none;
        text-align: center;
        cursor: pointer;
        box-shadow: 4px 4px 0px #000;
        transition: transform 0.12s ease, border-color 0.12s ease;
      }

      #relapse-payload-menu .payload-tile:hover,
      #relapse-payload-menu .payload-tile:focus {
        outline: none;
        transform: translate(-2px, -2px);
        background: #2f0d4d !important;
        border-color: var(--green-main) !important;
        box-shadow: 6px 6px 0px var(--green-main) !important;
      }

      #relapse-payload-menu .payload-tile.sending {
        opacity: 0.6;
        border-color: var(--yellow-accent) !important;
      }

      #relapse-payload-menu .payload-tile.sent {
        border-color: var(--green-main) !important;
        box-shadow: 4px 4px 0px var(--green-main) !important;
      }

      #relapse-payload-menu .payload-tile.failed {
        border-color: var(--pink-accent) !important;
        box-shadow: 4px 4px 0px var(--pink-accent) !important;
      }

      #relapse-payload-menu .payload-line {
        display: block !important;
        width: 100%;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        text-align: center;
      }

      #relapse-payload-menu .payload-title {
        font-family: var(--font-comic);
        color: var(--yellow-accent) !important;
        -webkit-text-fill-color: var(--yellow-accent) !important;
        font-size: 1.05rem;
        letter-spacing: 0.5px;
      }

      #relapse-payload-menu .payload-description {
        color: #eee !important;
        -webkit-text-fill-color: #eee !important;
        font-size: 0.78rem;
        margin-top: 3px;
      }

      #relapse-payload-menu .payload-info {
        font-family: monospace;
        color: var(--green-main) !important;
        -webkit-text-fill-color: var(--green-main) !important;
        font-size: 0.72rem;
        margin-top: 4px;
      }

      @media (max-width: 768px) {
        #relapse-payload-menu .payload-grid { grid-template-columns: 1fr; }
      }
    `;
    document.head.appendChild(style);

    const menu = document.createElement("section");
    menu.id = "relapse-payload-menu";
    menu.style.setProperty("visibility", "hidden", "important");
    menu.style.setProperty("opacity", "0", "important");
    menu.style.setProperty("pointer-events", "none", "important");

    const header = document.createElement("div");
    header.className = "payload-header";
    const title = document.createElement("h2");
    title.textContent = "PSN-HUB PAYLOADS";
    const status = document.createElement("p");
    status.className = "payload-status";
    status.textContent = "ELF Loader active on 127.0.0.1:9021";
    const help = document.createElement("p");
    help.className = "payload-help";
    help.textContent = "Select a cartridge below to inject payload.";
    header.append(title, status, help);

    const grid = document.createElement("div");
    grid.className = "payload-grid";

    for (const t of tiles) {
        const a = document.createElement("a");
        a.href = "#";
        a.className = "payload-tile";
        a.tabIndex = 0;

        const name = document.createElement("div");
        name.className = "payload-line payload-title";
        name.textContent = t.title;

        const description = document.createElement("div");
        description.className = "payload-line payload-description";
        description.textContent = t.description;

        const info = document.createElement("div");
        info.className = "payload-line payload-info";
        info.textContent = t.info || ("Port: " + (t.port || "9021"));

        for (const line of [name, description, info]) {
            line.style.setProperty("display", "block", "important");
            line.style.setProperty("visibility", "visible", "important");
            line.style.setProperty("opacity", "1", "important");
            line.style.setProperty("white-space", "normal", "important");
        }

        a.append(name, description, info);

        a.addEventListener("click", async (e) => {
            e.preventDefault();
            a.classList.remove("sent", "failed");
            a.classList.add("sending");
            try {
                const n = await window.__sendPayload(t.name);
                a.classList.remove("sending", "failed");
                a.classList.add("sent");
                alert(t.title + " injected successfully (" + n + " bytes)");
            } catch (err) {
                a.classList.remove("sending", "sent");
                a.classList.add("failed");
                alert("Payload failed: " + ((err && err.message) || err));
            }
        });
        grid.appendChild(a);
    }

    menu.append(header, grid);
    document.body.appendChild(menu);

    void menu.offsetHeight;
    for (const el of menu.querySelectorAll(".payload-line")) void el.offsetHeight;
    return menu;
}

function showPayloadMenu() {
    const term = document.getElementById("term-wrapper");
    if (term) term.style.display = "none";

    const menu = buildPayloadMenu();
    if (!menu) return;
    menu.style.setProperty("visibility", "visible", "important");
    menu.style.setProperty("opacity", "1", "important");
    menu.style.setProperty("pointer-events", "auto", "important");
    void menu.offsetHeight;
    requestAnimationFrame(() => { void menu.offsetHeight; });
}

buildPayloadMenu();
run().then(() => {
    try { sessionStorage.removeItem("relapse.auto-retry"); } catch (e) {}
    if (window.__elfldrUp && typeof window.__sendPayload === "function") {
        try {
            window.parent.postMessage({ type: 'done' }, '*');
        } catch (e) {}
        showPayloadMenu();
    }
}).catch(reportFailure);
</script>

</body>
</html>
